<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">Kick Soundboard</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141c24"/>
      <stop offset="1" stop-color="#090d12"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#80ff55"/>
      <stop offset="1" stop-color="#53fc18"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#53fc18" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Outer Rounded Square with Glowing Neon Green Kick Border -->
  <rect x="9" y="9" width="238" height="238" rx="54" fill="url(#background)" stroke="#53fc18" stroke-width="10"/>
  <!-- Central Kick Brand Circular Badge -->
  <circle cx="128" cy="128" r="80" fill="url(#green)"/>
  <!-- Music Note Emblem -->
  <ellipse cx="105" cy="172" rx="23" ry="16" transform="rotate(-18 105 172)" fill="#090d12"/>
  <path d="M121 166V82a6 6 0 0 1 6-6h10v88" fill="none" stroke="#090d12" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M136 78c18 2 32 9 44 21v27c-13-12-27-18-44-20Z" fill="#090d12"/>
</svg>
